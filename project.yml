name: Letterbox
options:
  bundleIdPrefix: app.letterbox
  deploymentTarget:
    iOS: "26.0"
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM} # from Makefile.local, see README
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Support address for reports and the Help screen, from Makefile.local (never in git).
    LETTERBOX_SUPPORT_EMAIL: ${SUPPORT_EMAIL}
  configs:
    # Location channels (chat over the internet) are left out of Release, the App Store
    # build: Letterbox is for when there's no internet, and it keeps App Review scope small.
    Debug:
      LETTERBOX_LOCATION_CHANNELS: "YES"
    Release:
      LETTERBOX_LOCATION_CHANNELS: "NO"
packages:
  LetterboxKit:
    path: Packages/LetterboxKit

# Both apps compile the same sources; the composition root wires the real adapters.
targetTemplates:
  LetterboxApp:
    type: application
    sources:
      - path: Letterbox
    dependencies:
      - package: LetterboxKit
        product: LetterboxDomain
      - package: LetterboxKit
        product: LetterboxApplication
      - package: LetterboxKit
        product: LetterboxCrypto
      - package: LetterboxKit
        product: LetterboxMesh
      - package: LetterboxKit
        product: LetterboxBLE
      - package: LetterboxKit
        product: LetterboxNostr
      - package: LetterboxKit
        product: LetterboxPersistence
      - package: LetterboxKit
        product: LetterboxDevice
      # Simulated radio and phones for the UI-test mode; only used under #if DEBUG.
      - package: LetterboxKit
        product: LetterboxTestSupport

targets:
  Letterbox:
    templates: [LetterboxApp]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.letterbox
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Config/Info-iOS.plist
      properties:
        CFBundleDisplayName: Letterbox
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral]
        LetterboxLocationChannels: $(LETTERBOX_LOCATION_CHANNELS)
        LetterboxSupportEmail: $(LETTERBOX_SUPPORT_EMAIL)
        NSBluetoothAlwaysUsageDescription: "Letterbox uses Bluetooth to chat with people nearby, with no internet and no accounts. Messages hop between phones running Letterbox."
        NSLocationWhenInUseUsageDescription: "Letterbox uses your approximate location only when you join a location channel, to pick the area's chat room. Your exact position is never sent."
        NSCameraUsageDescription: "Letterbox uses the camera only to scan a friend's code in person, to check their identity. Nothing is recorded or sent."

  LetterboxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LetterboxUITests
    dependencies:
      - target: Letterbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.letterbox.uitests
        TEST_TARGET_NAME: Letterbox
        GENERATE_INFOPLIST_FILE: YES

  LetterboxMac:
    templates: [LetterboxApp]
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.letterbox.mac
        PRODUCT_NAME: Letterbox
    info:
      path: Config/Info-macOS.plist
      properties:
        CFBundleDisplayName: Letterbox
        LSApplicationCategoryType: public.app-category.social-networking
        LetterboxLocationChannels: $(LETTERBOX_LOCATION_CHANNELS)
        LetterboxSupportEmail: $(LETTERBOX_SUPPORT_EMAIL)
        NSBluetoothAlwaysUsageDescription: "Letterbox uses Bluetooth to chat with people nearby, with no internet and no accounts."
        NSLocationUsageDescription: "Letterbox uses your approximate location only when you join a location channel."
        NSLocationWhenInUseUsageDescription: "Letterbox uses your approximate location only when you join a location channel."
    entitlements:
      path: Config/Letterbox-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.bluetooth: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.location: true

schemes:
  Letterbox:
    build:
      targets:
        Letterbox: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LetterboxUITests
  LetterboxMac:
    build:
      targets:
        LetterboxMac: all
